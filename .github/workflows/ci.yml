name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: PostgreSQL 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-16

      - name: Day-0 + spoken-card eval
        run: sh scripts/ci.sh
