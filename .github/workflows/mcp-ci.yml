name: MCP CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "mcp/**"
      - "plugin/**"
      - "company-os/**"
      - "templates/**"
      - "docs/runbooks/onboarding.md"
      - ".github/workflows/mcp-ci.yml"
      - "scripts/ci.sh"
      - "scripts/pg16-job.sh"
  pull_request:
    paths:
      - "mcp/**"
      - "plugin/**"
      - "company-os/**"
      - "templates/**"
      - "docs/runbooks/onboarding.md"
      - ".github/workflows/mcp-ci.yml"
      - "scripts/ci.sh"
      - "scripts/pg16-job.sh"
  schedule:
    # Daily fixture probe. Does not touch production. prod-smoke stays push-to-main only.
    - cron: "17 13 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    name: typecheck · test · smokes (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # fallback: ubuntu-24.04
    runs-on: [self-hosted, spark]
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        if: matrix.node != '22'
        run: npm run test:unit

      - name: Unit tests + line coverage ≥ 80%
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: Spoken-card eval (format + grounding)
        run: node --test test/spoken-card-eval.test.mjs

      - name: Cold-path smoke
        run: node test/cold-path.smoke.mjs

      - name: Stdio MCP client smoke (M1 protocol)
        run: node test/stdio-mcp.client.mjs

      - name: HTTP hosted-read smoke (no local clone)
        run: node test/http-mcp.client.mjs

      - name: PostgreSQL 16 throwaway cluster
        run: sh ../scripts/pg16-job.sh start

      - name: PostgreSQL 16 starter subscribe
        run: npm run test:pg16

      - name: Dist hygiene (no source maps required; entry exists)
        run: |
          test -f dist/index.js
          test -f dist/policy.js
          test -f dist/companies.js
          test -f dist/initiative-card.js
          ! test -d node_modules/.cache || true

      - name: Stop PostgreSQL and wipe temp cluster
        if: always()
        run: sh ../scripts/pg16-job.sh stop

  user-path:
    name: user-path (stdio · http · role-play · spoken-card eval)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # fallback: ubuntu-latest
    runs-on: [self-hosted, spark]
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: User-path (same command an independent verifier runs)
        run: |
          echo "CI green on this job is necessary and is not an independent pstack verdict."
          npm run verify:user-path

      - name: Stop PostgreSQL and wipe temp cluster
        if: always()
        run: sh ../scripts/pg16-job.sh stop

  markdown-path:
    name: markdown path integrity (no Node MCP required)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # fallback: ubuntu-latest
    runs-on: [self-hosted, spark]
    steps:
      - uses: actions/checkout@v4
      - name: Required portable files
        run: |
          set -euo pipefail
          for f in \
            company-os/operating-system.md \
            company-os/live-runtime.md \
            company-os/ready-for-human-eyes.md \
            company-os/ai-instructions.md \
            company-os/first-hour.md \
            company-os/after-proof-efficiency.md \
            docs/install-bill.md \
            templates/company/state/company-state.json \
            templates/company/state/company-state.schema.json \
            templates/company/state/where-are-we.py \
            templates/applied-here.md \
            mcp/test/spoken-card-eval.test.mjs
          do
            test -s "$f"
            echo "ok $f"
          done
          python3 - <<'PY'
          import json
          s = json.load(open("templates/company/state/company-state.json"))
          for k in ("companyId", "journeyPhase", "loopStage", "readyForHumanEyes", "openQuestions"):
              assert k in s, k
          assert s["readyForHumanEyes"]["status"] == "unknown"
          schema = json.load(open("templates/company/state/company-state.schema.json"))
          assert "initiatives" in schema["properties"], "schema must define initiatives[]"
          kinds = schema["properties"]["initiatives"]["items"]["properties"]["kind"]["enum"]
          for kind in ("customer_check", "engagement", "capital", "legal", "advisor"):
              assert kind in kinds, kind
          print("state template + initiatives schema ok")
          PY

      - name: Stop PostgreSQL and wipe temp cluster
        if: always()
        run: sh scripts/pg16-job.sh stop

  onboarding-probe:
    name: onboarding probe (fixtures, never prod)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # fallback: ubuntu-latest
    runs-on: [self-hosted, spark]
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Probe (invite, session grant, whoami — PGlite only)
        run: npm run probe:onboarding

      - name: Stop PostgreSQL and wipe temp cluster
        if: always()
        run: sh ../scripts/pg16-job.sh stop

  # Hosted MCP only after merge. PRs stay on local stdio/http. Bounded GET /health + handshake.
  prod-smoke:
    name: production pin (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [mcp, user-path]
    # fallback: ubuntu-latest
    runs-on: [self-hosted, spark]
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Wait for Vercel production health
        run: |
          set -euo pipefail
          url="https://mcp.bootstrap.pirin.ai/health"
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 "$url" | grep -qx ok; then
              echo "prod health ok after ${i} tries"
              exit 0
            fi
            echo "waiting for prod health ($i)"
            sleep 15
          done
          echo "::error::$url never returned ok"
          exit 1

      - name: Production handshake pin
        run: npm run test:preview

      - name: Stop PostgreSQL and wipe temp cluster
        if: always()
        run: sh ../scripts/pg16-job.sh stop
